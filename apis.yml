name: AmpMe
description: AmpMe is a mobile application that synchronizes music playback across multiple smartphones
  to create a collective, portable sound system. Users connect friends' phones together so their device
  speakers play the same track in sync, amplifying the audio for parties and gatherings. The app supports
  streaming sources such as Spotify, YouTube, SoundCloud, and Deezer, and runs natively on iOS and Android.
  AmpMe was surfaced as a portfolio company of 500 Global and added to the API Evangelist network for
  enrichment; it is a consumer mobile product that does not currently publish a public developer API.
